name: Context Factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  context-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify context lock, structure, and behavior
        run: node scripts/context.mjs doctor
